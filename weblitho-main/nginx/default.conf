server {
    listen 80;
    server_name _;

    # Frontend - serve React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy to backend server
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preview static sites - serves built project previews
    # Matches paths like /preview/12345, /preview/my-project-id
    location ~ ^/preview/([0-9a-zA-Z_-]+)(/.*)?$ {
        set $project_id $1;
        set $file_path $2;
        
        # Default to index.html if no file path specified
        if ($file_path = "") {
            set $file_path /index.html;
        }
        if ($file_path = "/") {
            set $file_path /index.html;
        }
        
        alias /projects/$project_id/dist$file_path;
        
        # Prevent caching for previews (always fresh content)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;
}

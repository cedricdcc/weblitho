services:
  # Frontend - Nginx serving React SPA and routing
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weblitho-webapp
    restart: unless-stopped
    ports:
      - "90:80"
    volumes:
      - projects:/projects:ro
    depends_on:
      - backend
    networks:
      - weblitho-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend - Express server for preview builds
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: weblitho-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - PROJECTS_DIR=/projects
    volumes:
      - projects:/projects:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - weblitho-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  weblitho-network:
    driver: bridge

volumes:
  projects:
    driver: local
